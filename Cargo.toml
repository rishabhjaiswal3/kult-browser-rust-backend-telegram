[package]
name = "kult-browser-backend-rust"
version = "0.1.0"
edition = "2021"

[features]
default = []
dev-bins = []

[[bin]]
name = "kult_browser_backend_rust"
path = "src/main.rs"

[[bin]]
name = "test_bright_data"
path = "bin/test/test_bright_data.rs"
required-features = ["dev-bins"]

[[bin]]
name = "test_post_verification"
path = "bin/test/test_post_verification.rs"
required-features = ["dev-bins"]

[[bin]]
name = "test_full_scrape_pipeline"
path = "bin/test/test_full_scrape_pipeline.rs"
required-features = ["dev-bins"]

[[bin]]
name = "test_0g_upload"
path = "bin/test/test_0g_upload.rs"
required-features = ["dev-bins"]

[[bin]]
name = "test_moment_migration_pipeline"
path = "bin/test/test_moment_migration_pipeline.rs"
required-features = ["dev-bins"]

[[bin]]
name = "test_prod_flow"
path = "bin/test/test_prod_flow.rs"
required-features = ["dev-bins"]

[[bin]]
name = "test_marketplace_flow"
path = "bin/test/test_marketplace_flow.rs"
required-features = ["dev-bins"]

[dependencies]
mongodb = "3.1"
tokio = { version = "1", features = ["full"] }
dotenvy = "0.15"
serde = { version = "1.0", features = ["derive"]}
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
bson = { version = "2", features = ["chrono-0_4"] }
futures = "0.3"
axum = { version = "0.7", features = ["macros"] }
regex = "1"
jsonwebtoken = "9.2"
once_cell = "1.21.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "json"] }
tower-http = { version = "0.5", features = ["trace", "cors"] }
nanoid = "0.4"
redis = { version = "0.27", features = ["tokio-rustls-comp"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
base64 = "0.22"
aws-config = "1.8.13"
aws-sdk-s3 = "1.122.0"
alloy = { version = "1.7.3", features = ["signers", "signer-local", "rand"] }
rustls = { version = "0.23", features = ["ring"] }
sha2 = "0.10.9"
hmac = "0.12"
tower_governor = "0.4"
utoipa = { version = "5", features = ["axum_extras", "chrono"] }
utoipa-swagger-ui = { version = "8", features = ["axum", "vendored"] }
